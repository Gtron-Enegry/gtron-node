[package]
name = "gtron-tron-signing"
description = "Build, check, sign and broadcast TRON transactions without trusting the node that builds them"
version.workspace = true
edition.workspace = true
# Public with gtron-node (github.com/Gtron-Enegry/gtron-node); the platform crates are not.
license = "Apache-2.0"
repository = "https://github.com/Gtron-Enegry/gtron-node"
publish.workspace = true
# `File::try_lock` for the state directory.
rust-version.workspace = true

[features]
# Transaction encoders for other crates' test fixtures.
test-util = []

[dependencies]
gtron-tron-address = { version = "0.1.0", path = "../tron-address" }
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
sha3 = "0.12.0"
thiserror = "2.0.21"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
# `geteuid` for the ownership check on secret files.
libc = "0.2.191"

[dev-dependencies]
chrono = "0.4.45"
