[package]
name = "gtron-node"
description = "gtron.network marketplace agent: delegates TRON energy from your wallet, key never leaves the machine"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/Gtron-Enegry/gtron-node"
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "gtron-node"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Only the public crates: gtron-node builds on its own at github.com/Gtron-Enegry/gtron-node.
gtron-tron-address = { version = "0.1.0", path = "../tron-address" }
gtron-tron-signing = { version = "0.1.0", path = "../tron-signing" }
clap = { version = "4.6.7", features = ["derive", "env"] }
# `gtron-node setup` prompts; same console as cliclack uses.
cliclack = "0.5.6"
console = "0.16"
dotenvy = "0.15.7"
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
# Terminal echo off during `gtron-node setup`.
libc = "0.2.191"

[dev-dependencies]
axum = "0.8.9"
