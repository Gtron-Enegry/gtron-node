# gtron-node in Docker by hand (`gtron-node setup` writes this for you). Next to this file:
#   node.env     settings, from node.env.example (mode 0600)
#   wallet.key   the wallet's private key in hex (mode 0400, owned by uid 10001:
#                sudo chown 10001:10001 wallet.key)
#   state/       sudo install -d -o 10001 -g 10001 -m 0700 state
# Then:
#   docker compose run --rm gtron-node --check
#   docker compose up -d
services:
  gtron-node:
    image: ghcr.io/gtron-enegry/gtron-node:latest
    user: "10001:10001"
    env_file: node.env
    environment:
      NODE_STATE_DIR: /var/lib/gtron-node
      NODE_PRIVATE_KEY_FILE: /run/secrets/wallet_key
    secrets:
      - wallet_key
    volumes:
      # Signed transactions live here: keep it across upgrades.
      - ./state:/var/lib/gtron-node
    restart: unless-stopped
    stop_grace_period: 120s
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

secrets:
  wallet_key:
    file: ./wallet.key
