name: release

# Push a tag `v<version>` (the workspace version) to release: binaries for Linux (static
# musl, x86_64 and arm64) and macOS, SHA256SUMS, install.sh, and the image
# ghcr.io/gtron-enegry/gtron-node. The release is built as a draft and published only once
# every file is up, so `releases/latest` never points at a half-uploaded one.
#
# Only the upload steps hold a token that can write: tests and builds run third-party
# build scripts, so they get a read-only token and no cache from earlier runs. Every file
# carries a GitHub build provenance attestation (`gh attestation verify FILE -R
# Gtron-Enegry/gtron-node`), so a file swapped on the release page does not verify.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag matches the workspace version
        run: |
          v="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)"/\1/')"
          test "$TAG" = "v$v" || { echo "tag $TAG, workspace version $v"; exit 1; }
      - name: Create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "gtron-node ${TAG#v}" \
            --notes "Install or upgrade: \`curl -fsSL https://gtron.network/install-node.sh | sh\`. Docker: \`ghcr.io/gtron-enegry/gtron-node:${TAG#v}\`. Check archives against SHA256SUMS."

  build:
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-apple-darwin, os: macos-latest, zig: false }
          - { target: x86_64-apple-darwin, os: macos-latest, zig: false }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-zigbuild
      - name: Install zig
        if: matrix.zig
        # cargo-zigbuild finds zig through `python3 -m ziglang`; a venv keeps it off the
        # runner's externally-managed system Python.
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          echo "ziglang==0.13.0 --hash=sha256:3ce0c9f16547e5d61b32e0d226926e9a2552ef4b91fccf7ab5ea1a623a77824b" > "$RUNNER_TEMP/zig.txt"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zig.txt"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Test
        # Once per OS, on the host: the cross builds compile the same code.
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked
      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p gtron-node --target ${{ matrix.target }}
          else
            cargo build --release --locked -p gtron-node --target ${{ matrix.target }}
          fi
      - name: Package
        # Unversioned names, so releases/latest/download/<name> always works for install.sh.
        run: |
          name="gtron-node-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/gtron-node" README.md LICENSE "$name/"
          cp crates/node/dist/gtron-node.service crates/node/dist/node.env.example "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtron-node-${{ matrix.target }}
          path: gtron-node-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gtron-node-*
          merge-multiple: true
          path: out
      - name: Checksums and installer
        run: |
          cp install.sh out/
          cd out
          test "$(ls gtron-node-*.tar.gz | wc -l)" -eq 4
          sha256sum gtron-node-*.tar.gz install.sh | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/gtron-node-*.tar.gz
            out/install.sh
            out/SHA256SUMS
      - name: Upload
        # No --clobber: the draft is new, so a file already there means something is wrong.
        run: gh release upload "$TAG" out/gtron-node-*.tar.gz out/install.sh out/SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Image
        id: image
        run: |
          mkdir -p image/bin/amd64 image/bin/arm64
          tar -xzf out/gtron-node-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          tar -xzf out/gtron-node-aarch64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/gtron-node-x86_64-unknown-linux-musl/gtron-node" image/bin/amd64/
          cp "$RUNNER_TEMP/gtron-node-aarch64-unknown-linux-musl/gtron-node" image/bin/arm64/
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker buildx build image -f crates/node/dist/Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            -t "$image:${TAG#v}" -t "$image:latest" --push --metadata-file meta.json
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
